version: '3.8'

services:
  # BLS Enterprise API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bls_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/bls_and_company
      - REDIS_URL=redis://:blsRedisSecretPass123@redis:6379
      - REDIS_ENABLED=true
      - JWT_ACCESS_SECRET=bls_super_secure_jwt_access_production_secret_key_2026
      - JWT_REFRESH_SECRET=bls_super_secure_jwt_refresh_production_secret_key_2026
      - ACCESS_TOKEN_EXPIRES_IN=1h
      - REFRESH_TOKEN_EXPIRES_IN=7d
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=15
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bls_network

  # MongoDB Primary Database
  mongo:
    image: mongo:7.0
    container_name: bls_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - bls_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis In-Memory Cache & Task Queue
  redis:
    image: redis:7.2-alpine
    container_name: bls_redis
    restart: always
    command: redis-server --requirepass blsRedisSecretPass123 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bls_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "blsRedisSecretPass123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  bls_network:
    driver: bridge
